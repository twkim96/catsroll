<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f8fb">
  <title>Catsroll 공개 안내</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #18212f; background: #f6f8fb; }
    * { box-sizing: border-box; }
    body { margin: 0; line-height: 1.65; }
    header, main, footer { width: min(100% - 2rem, 52rem); margin-inline: auto; }
    header { padding-block: 1.25rem; border-bottom: 1px solid #dce3ed; }
    header a { color: inherit; font-weight: 700; text-decoration: none; }
    nav { display: flex; flex-wrap: wrap; gap: .5rem 1rem; margin-top: .75rem; }
    nav a, main a, footer a { color: #1459a6; text-underline-offset: .16em; }
    main { min-height: 65vh; padding-block: 1.75rem 2.5rem; }
    h1 { margin: 0 0 1rem; font-size: clamp(1.65rem, 5vw, 2.2rem); line-height: 1.25; }
    h2 { margin-top: 1.8rem; font-size: 1.2rem; line-height: 1.35; }
    p, ul { max-width: 70ch; }
    .draft { padding: .85rem 1rem; border: 1px solid #a45b00; border-radius: .5rem; background: #fff5e6; color: #572e00; font-weight: 650; }
    footer { padding-block: 1rem 2rem; border-top: 1px solid #dce3ed; color: #536174; font-size: .92rem; }
    @media (min-width: 42rem) { header, main, footer { width: min(100% - 3rem, 52rem); } }
  </style>
</head>
<body>
  <header>
    <a href="/gpt/about">Catsroll</a>
    <nav aria-label="안내 페이지">
      <a href="/gpt/about">소개</a>
      <a href="/gpt/privacy">개인정보처리방침</a>
      <a href="/gpt/terms">이용 안내</a>
      <a href="https://github.com/twkim96/catsroll/issues" rel="noreferrer">GitHub Issues</a>
    </nav>
  </header>
  <main id="main">
    <!-- CONTENT -->
  </main>
  <footer>
    Catsroll은 PONOS 또는 OpenAI의 공식 서비스가 아닙니다.
  </footer>
</body>
</html>
