<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catsroll · Multi</title>
  <style>{{STYLE}}</style>
</head>
<body>
  <main class="app-shell gpt-shell" id="catsroll-app">
    <header class="app-header">
      <div class="brand">
        <img class="brand-icon" alt="" src="{{ICON_DATA_URI}}">
        <div>
          <h1 class="brand-wordmark">Catsroll</h1>
          <p class="eyebrow">Multi · 배열 · Find · 시드 찾기</p>
        </div>
      </div>
      <span class="bridge-pill" id="bridge-state">연결 확인 중</span>
    </header>



    <section class="panel mode-panel" aria-label="계산 방식">
      <div class="gpt-mode-row">
      <label class="field mode-field">
        <span>계산</span>
        <select id="mode">
          <option value="multi">Multi 배열</option>

          <option value="seek">시드 찾기</option>
        </select>
      </label>
      <label class="check-field" id="find-toggle-label"><input id="find-enabled" type="checkbox"><span>Find 경로</span></label>
      </div>
      <div class="field-grid seed-fields" id="seed-fields">
        <label class="field" id="seed-field"><span>시드</span><input id="seed" inputmode="numeric" autocomplete="off" placeholder="예: 123456789"></label>
        <label class="field" id="count-field"><span>횟수</span><input id="count" type="number" min="1" max="999" value="300"></label>
        <label class="field" id="last-field"><span>마지막 ID</span><input id="last" inputmode="numeric" autocomplete="off" placeholder="선택"></label>
      </div>
    </section>

    <section class="panel rows-panel" id="rows-panel">
      <div class="section-heading">
        <div><h2>배너 풀</h2><p id="row-help">계산에 사용할 배너와 풀 설정을 선택하세요.</p></div>
        <button class="button button-small" id="add-row" type="button">+ 배너</button>
      </div>
      <div class="row-list" id="rows"></div>
    </section>

<section class="action-panel" id="multi-actions-panel"><div class="action-buttons" id="multi-actions"><button class="button button-primary" id="calculate" type="button">계산하기</button><button class="button button-cancel" id="cancel" type="button" hidden>중단</button></div><p id="status" class="status-message" role="status" aria-live="polite"></p></section>
<div class="gpt-share"><button id="send-context" type="button" disabled>결과를 GPT에 전달</button><span>공유하면 서버 메모리에 저장하며 최대 1시간 조회할 수 있습니다. 만료본은 후속 요청 때 정리하며 서버 재시작 시 사라집니다.</span></div>
<section class="panel share-recovery" id="share-recovery" hidden aria-labelledby="share-recovery-title">
  <h2 id="share-recovery-title">결과 내보내기</h2>
  <p class="share-recovery-provenance" id="share-recovery-provenance"></p>
  <p class="status-message" id="share-recovery-status" role="status" aria-live="polite"></p>
  <textarea id="share-recovery-json" aria-label="계산 결과 전체 JSON" readonly spellcheck="false"></textarea>
  <details><summary>대화에 보낼 요약 보기</summary><textarea id="share-recovery-text" aria-label="계산 결과 전송 요약" readonly spellcheck="false"></textarea></details>
  <div class="action-buttons">
    <button class="button button-secondary" id="copy-share-json" type="button">JSON 복사</button>
    <button class="button button-secondary" id="download-share-json" type="button">JSON 다운로드</button>
  </div>
</section>
<div id="multi-container">{{MULTI}}</div>
<section class="panel" id="seek-panel" hidden>
  <h2>시드 찾기</h2>
  <p>위에서 배너 하나를 선택하고 관측한 일반 뽑기 결과를 순서대로 입력하세요.</p>
  <div id="seek-rolls" class="seek-rolls"></div>
  <div class="action-buttons" id="seek-actions">
    <button class="button button-secondary" id="add-roll" type="button">+ 관측 결과</button>
    <button class="button button-primary" id="calculate-seek" type="button">시드 계산</button>
  </div>
  <div id="seek-result"></div>
</section>
<p class="gpt-footer">계산은 이 기기에서 실행합니다. 플랜 저장은 현재 앱을 연 동안 유지됩니다.</p>
</main>
<script id="catsroll-worker-source" type="application/json">{{WORKER_SOURCE}}</script>
<script id="catsroll-find-worker-source" type="application/json">{{FIND_WORKER_SOURCE}}</script>
<script>{{SCRIPTS}}</script></body></html>
