name: Update KR/JP live events and deploy

on:
  schedule:
    - cron: '7 * * * *'
    - cron: '37 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: update-live-events-and-deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Update KR/JP event data
        id: update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          before=$(git rev-parse HEAD)
          ruby bin/update-live-events.rb kr jp --commit --push origin
          after=$(git rev-parse HEAD)
          if [ "$before" = "$after" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy main to Hugging Face
        if: github.event_name == 'workflow_dispatch' || steps.update.outputs.changed == 'true'
        run: |
          set -euo pipefail
          ID_TOKEN=$(curl -fsSL \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://huggingface.co" | \
            jq -r .value)
          HF_TOKEN=$(curl -fsSL -X POST https://huggingface.co/oauth/token \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg token "$ID_TOKEN" \
              --arg resource "spaces/twkim96/my-cats-rolls" \
              '{
                grant_type: "urn:ietf:params:oauth:grant-type:token-exchange",
                subject_token_type: "urn:ietf:params:oauth:token-type:id_token",
                subject_token: $token,
                resource: $resource
              }')" | jq -r .access_token)
          test -n "$HF_TOKEN"
          test "$HF_TOKEN" != null
          echo "::add-mask::$HF_TOKEN"
          git remote add hf-deploy "https://twkim96:${HF_TOKEN}@huggingface.co/spaces/twkim96/my-cats-rolls"
          git push hf-deploy HEAD:main
